{% extends "attendance/base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if form.errors %}<p class="error" role="alert">Phone number or PIN is wrong.</p>{% endif %}
<form method="post" class="stack">{% csrf_token %}
  <label>Phone number <input name="username" inputmode="tel" autocomplete="username" required autofocus></label>
  <label>PIN <input name="password" type="password" inputmode="numeric" autocomplete="current-password" required></label>
  <button>Sign in</button>
</form>
{% endblock %}
