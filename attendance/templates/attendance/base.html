{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Teacher attendance{% endblock %}</title>
<link rel="stylesheet" href="{% static 'attendance/style.css' %}">
{% block head %}{% endblock %}
</head>
<body>
<header class="bar">
  <strong>SUBEB Teacher Attendance</strong>
  {% if user.is_authenticated %}
  <form method="post" action="{% url 'logout' %}">{% csrf_token %}<span>{{ user.get_full_name|default:user.username }}</span> <button>Sign out</button></form>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
